  <!-- Font preload (Piece B, Round 2 mobile-nav brief): self-hosted via
    `@fontsource-variable/manrope`'s CSS `@import` in `index.css`, but that import's
    output filename is content-hashed at build time and unknowable here — so the file is
    copied byte-for-byte into `public/fonts/` (served at an identical, stable path in both
    `vite dev` and the production build, unlike a `node_modules` path, which only the dev
    server special-cases) purely so this `<link>` can warm the browser's font cache before
    the stylesheet that actually `@font-face`s it parses. The CSS import stays the single
    source of truth for the `@font-face` rule; this is a cache warm-up, not a second font
    pipeline, and a stale/missing preload degrades to a normal (unwarmed) font load rather
    than breaking anything. -->
  <link rel="preload" as="font" type="font/woff2" crossorigin
    href="/fonts/manrope-latin-wght-normal.woff2">

  <script>
    // Pre-paint theme resolution (Codex round-1 finding 12, manager ruling; mirrors
    // `app/index.html`'s pre-paint script in the Operon repository, GUI pass task 1;
    // widened by fix brief row 11, `docs/specs/operon-gui-pass-fix-brief.md`, "the hop").
    // Runs synchronously, before React mounts, so the first frame already carries the
    // right class instead of painting a persisted Kaneo theme and flashing to Operon's
    // choice once `ThemeProvider`'s effect (GUI pass task 4b) runs. Never throws: a
    // blocked storage API or a malformed cookie must still let the page paint.
    //
    // Order: the operon_theme cookie (GUI pass task 4b's handoff) beats this store's own
    // persisted `user-preferences` record beats the store's own default ("dark").
    //
    // `navy` now maps to `navy` (fix brief row 8) — Kaneo's OWN first-class theme
    // (`index.css`'s `.navy` block), not `dark`. Fix brief row 11 additionally stamps a
    // navy `background-color` directly on `<html>` before the stylesheet has necessarily
    // applied, and swaps `<meta name="theme-color">` to navy's hex — so the Operon ->
    // Initiative hop never paints a white or grey frame between origins, matching the
    // Operon shell's own pre-paint script.
    (function () {
      var OPERON_TO_KANEO = { navy: 'navy', light: 'light', dark: 'dark' };
      var THEME_COLOR = { navy: '#081a33', light: '#faf8f4', dark: '#0e2546' };
      function fromOperonCookie() {
        var match = document.cookie.match(/(?:^|;\s*)operon_theme=([^;]+)/);
        if (!match) return null;
        try {
          return OPERON_TO_KANEO[decodeURIComponent(match[1])] || null;
        } catch (e) {
          return null;
        }
      }
      function fromStore() {
        try {
          var raw = window.localStorage.getItem('user-preferences');
          if (!raw) return null;
          var parsed = JSON.parse(raw);
          var stored = parsed && parsed.state && parsed.state.theme;
          if (stored === 'light' || stored === 'dark' || stored === 'navy') return stored;
          if (stored === 'system') {
            return window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
          }
          return null;
        } catch (e) {
          return null;
        }
      }
      var theme = fromOperonCookie() || fromStore() || 'dark';
      document.documentElement.classList.add(theme);
      document.documentElement.style.backgroundColor = THEME_COLOR[theme];
      try {
        var meta = document.getElementById('operon-theme-color');
        if (meta) meta.setAttribute('content', THEME_COLOR[theme]);
      } catch (e) {
        // theme-color is cosmetic (PWA chrome tint) — never worth breaking the mount over.
      }
    })();
  </script>

  <script>
    if (window.location.hostname === 'demo.kaneo.app') {
      const script = document.createElement('script');
      script.defer = true;
      script.setAttribute('data-domain', 'demo.kaneo.app');
      script.src = 'https://plausible.kaneo.app/js/script.js';
      document.head.appendChild(script);
    }

    if (window.location.hostname === 'cloud.kaneo.app') {
      const script = document.createElement('script');
      script.defer = true;
      script.setAttribute('data-domain', 'cloud.kaneo.app');
      script.src = 'https://plausible.kaneo.app/js/script.js';
      document.head.appendChild(script);
    }
  </script>

<body>
  <!-- Navy hand-off skeleton (Piece B, Round 2 mobile-nav brief — "no flash on the hop").
    Scoped to `html.navy` (the class the pre-paint script above already applied
    SYNCHRONOUSLY, before this paints) so light/dark hops see only their own plain
    background and never a stray navy rectangle. Shapes a 64px module strip + list panel
    — the same silhouette `MobileNavigate.tsx` draws on the Operon side of this same
    hop — in `rgba(255,255,255,.10)` on the navy ground, so the curtain the Operon shell
    already paints before `window.location.assign` hands off into a frame that already
    looks like the destination instead of a blank one.

    NOT inside `#root` (Codex/manager catch, live-container repro): `main.tsx` (untouched,
    off this fork's touch list) guards its mount with
    `if (!rootElement.innerHTML) { createRoot(rootElement).render(...) }` — a non-empty
    `#root` at parse time makes that condition false and React never mounts at all, silently
    (no console error, `#root` just keeps whatever static HTML was in it forever). The
    skeleton is therefore a SIBLING of `#root`, absolutely positioned over it, and a small
    `MutationObserver` below removes it the moment `#root` gains its first real child —
    the equivalent of "React replaces it automatically" for a codebase whose entry point
    requires `#root` to start genuinely empty. -->
  <style>
    #operon-skeleton { display: none; }
    html.navy #operon-skeleton { display: flex; }
  </style>
  <div id="operon-skeleton" aria-hidden="true"
    style="position:fixed;inset:0;background:#081a33;">
    <div style="width:64px;flex-shrink:0;display:flex;flex-direction:column;align-items:center;gap:8px;padding:12px 8px;">
      <div style="width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.10);"></div>
      <div style="width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.10);"></div>
      <div style="width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.10);"></div>
      <div style="width:48px;height:48px;border-radius:16px;background:rgba(255,255,255,.10);"></div>
    </div>
    <div style="flex:1;display:flex;flex-direction:column;gap:10px;padding:16px 12px;">
      <div style="width:120px;height:16px;border-radius:4px;background:rgba(255,255,255,.10);"></div>
      <div style="width:100%;height:40px;border-radius:8px;background:rgba(255,255,255,.10);"></div>
      <div style="width:100%;height:36px;border-radius:6px;background:rgba(255,255,255,.10);"></div>
      <div style="width:100%;height:36px;border-radius:6px;background:rgba(255,255,255,.10);"></div>
      <div style="width:100%;height:36px;border-radius:6px;background:rgba(255,255,255,.10);"></div>
    </div>
  </div>
  <script>
    // Removes the skeleton the moment #root gains its first real child — main.tsx's own
    // `if (!rootElement.innerHTML)` mount guard requires #root to still be genuinely empty
    // when it runs, so this observer (not a React effect) is what tears the skeleton down.
    // Never throws: a missing #root/skeleton (a future markup change) must not block paint.
    (function () {
      try {
        var skeleton = document.getElementById('operon-skeleton');
        var root = document.getElementById('root');
        if (!skeleton || !root) return;
        var observer = new MutationObserver(function () {
          if (root.childNodes.length > 0) {
            skeleton.remove();
            observer.disconnect();
          }
        });
        observer.observe(root, { childList: true });
      } catch (e) {
        // Cosmetic hand-off only — never worth breaking the mount over.
      }
    })();
  </script>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
