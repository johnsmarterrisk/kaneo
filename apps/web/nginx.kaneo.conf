server {
    listen 5173;
    server_name localhost;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "0" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    client_max_body_size 25m;

    gzip on;
    gzip_vary on;
    gzip_min_length 1000;
    gzip_proxied any;
    gzip_types text/plain text/css application/json application/javascript text/xml application/xml application/xml+rss text/javascript;
    gzip_comp_level 6;

    location = /.well-known/oauth-protected-resource/api/mcp {
        proxy_pass http://127.0.0.1:1337/.well-known/oauth-protected-resource/api/mcp;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /.well-known/oauth-authorization-server/api {
        proxy_pass http://127.0.0.1:1337/.well-known/oauth-authorization-server/api;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location /.well-known/ {
        return 404;
    }

    location /api/ {
        proxy_pass http://127.0.0.1:1337/api/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # FRESHNESS (Operon stabilization plan task 0.4, decision D4; fork-discipline row 2,
    # Stabilization Stage 1 note). `Cache-Control: no-cache` on every response this
    # location serves — `index.html`, the SPA fallback and the content-hashed bundles —
    # matching Operon's own two nginx sets byte-for-intent (`nginx/conf.d/operon-proxy.inc`,
    # `operon-proxy.prod.inc`). `no-cache` means "revalidate before use," not "never cache":
    # nginx's own `ETag` on a static file lets an unchanged client get a 304. No `immutable`
    # claim: `env.sh` (below) rewrites the ALREADY-BUILT bundle's bytes at container start —
    # `KANEO_CLIENT_URL`, `KANEO_API_URL`, `OPERON_APEX_URL` and the OIDC endpoints are all
    # substituted post-build — so a hashed filename can carry different bytes across two
    # container starts of the SAME image and must keep revalidating. This is also where
    # `version.json` (task 0.5/0.6, written by `env.sh`) is served from, so it inherits the
    # same header.
    location / {
        root /usr/share/nginx/html;
        index index.html;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
